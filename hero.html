                <h1>갤러리</h1>

            </div>
                <h1>여명의 투쟁</h1> <p>자연 - 자족 - 자립</p>
                <div class="SCROLLPOSTER">
                    <button class="btn btn-left" id="btnPrev">◀</button>
                    <button class="btn btn-right" id="btnNext">▶</button>
                    <div class="scroll-container" id="scroller"  style="display: flex; flex-direction: row;">
                        <div class="poster-card"><img src="img/hero/img1.png" alt="poster1"></div>
                    </div>
                </div>
        </div>

        <script>
          document.querySelectorAll('.SCROLLPOSTER').forEach(container => {
            const scroller = container.querySelector('.scroll-container');
            const btnPrev = container.querySelector('.btn-left');
            const btnNext = container.querySelector('.btn-right');
            if (!scroller) return;

            let isDown = false;
            let startX = 0;
            let scrollLeftStart = 0;


            scroller.addEventListener('pointerdown', e => {
              isDown = true;
              scroller.style.cursor = 'grabbing';
              startX = e.clientX;
              scrollLeftStart = scroller.scrollLeft;
              if (scroller.setPointerCapture) scroller.setPointerCapture(e.pointerId);
            });

            scroller.addEventListener('pointermove', e => {
              if (!isDown) return;
              const dx = e.clientX - startX;
              scroller.scrollLeft = scrollLeftStart - dx;
            });

            const stopDrag = e => {
              if (!isDown) return;
              isDown = false;
              scroller.style.cursor = 'grab';
              try { scroller.releasePointerCapture(e.pointerId); } catch {}
            };
            scroller.addEventListener('pointerup', stopDrag);
            scroller.addEventListener('pointercancel', stopDrag);
            scroller.addEventListener('pointerleave', stopDrag);


            scroller.addEventListener('wheel', e => {
              if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                
                e.preventDefault();
                scroller.scrollLeft += e.deltaX;
              }
            }, { passive: false });


            function cardWidth() {
              const card = scroller.querySelector('.poster-card');
              const gap = parseFloat(getComputedStyle(scroller).gap) || 16;
              return (card ? card.getBoundingClientRect().width : 500) + gap;
            }
            btnPrev.addEventListener('click', () => scroller.scrollBy({ left: -cardWidth(), behavior: 'smooth' }));
            btnNext.addEventListener('click', () => scroller.scrollBy({ left:  cardWidth(), behavior: 'smooth' }));


            setInterval(() => {
              const card = scroller.querySelector('.poster-card');
              const gap = parseFloat(getComputedStyle(scroller).gap) || 16;
              const cardWidth = (card ? card.getBoundingClientRect().width : 500) + gap;
              scroller.scrollBy({ left: cardWidth, behavior: 'smooth' });

              if (scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 5) {
                scroller.scrollTo({ left: 0, behavior: 'smooth' });
              }
            }, 5000);
          });
        </script>
